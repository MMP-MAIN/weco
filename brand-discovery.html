<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="업종·지역·상권·고객·운영 조건을 함께 확인하고 브랜드의 가능성과 다음 행동을 정리하는 위코컴퍼니 무료 1차 진단입니다." />
  <link rel="canonical" href="https://wecocompany.com/brand-discovery.html" />
  <title>무료 브랜드 가능성 분석 — 위코컴퍼니</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;background:#f5f0e4;overflow:hidden}
    iframe{display:block;width:100%;height:100%;border:0;background:#f5f0e4}
    .fallback{position:fixed;inset:auto 18px 18px;z-index:2;margin:0;text-align:center;font:12px/1.5 Arial,"Apple SD Gothic Neo",sans-serif;color:#53665b;pointer-events:none}
    .fallback a{color:#006b3f;pointer-events:auto}
  </style>
</head>
<body>
  <iframe
    id="brand-discovery-frame"
    src="https://weco-brand-discovery.leeyounghwan.chatgpt.site/"
    title="위코컴퍼니 무료 브랜드 가능성 분석"
    allow="clipboard-read; clipboard-write"
  ></iframe>
  <p class="fallback" id="brand-discovery-fallback" hidden>화면이 열리지 않으면 <a href="https://weco-brand-discovery.leeyounghwan.chatgpt.site/" target="_top">분석 페이지 바로가기</a></p>
  <script>
    const frame = document.getElementById('brand-discovery-frame');
    const fallback = document.getElementById('brand-discovery-fallback');
    let loaded = false;
    frame.addEventListener('load', () => {
      loaded = true;
      fallback.hidden = true;
    });
    window.setTimeout(() => {
      if (!loaded) fallback.hidden = false;
    }, 8000);
  </script>
</body>
</html>
